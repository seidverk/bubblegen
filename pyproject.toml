[project]
name = "bubblegen"
version = "0.11.0"
description = "Parametric inflated 3D bubble letters from any TTF/OTF font, flat-backed and printable"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Igor Churmeev", email = "ingvarch@gmail.com" }]
keywords = ["3d-printing", "stl", "typography", "font", "mesh", "marching-cubes", "sdf"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Multimedia :: Graphics :: 3D Modeling",
  "Topic :: Printing",
  "Typing :: Typed",
]
dependencies = [
  "fonttools>=4.53",
  "matplotlib>=3.9",
  "numpy>=1.26",
  "scipy>=1.13",
  "scikit-image>=0.24",
  "trimesh>=4.4",
  "manifold3d>=2.5",
  "fast-simplification>=0.1.7",
]

[project.scripts]
bubblegen = "bubblegen.cli:main"

[project.urls]
Homepage = "https://github.com/ingvarch/bubble-alphabet-is"
Repository = "https://github.com/ingvarch/bubble-alphabet-is"
Issues = "https://github.com/ingvarch/bubble-alphabet-is/issues"

[dependency-groups]
dev = [
  "mypy>=1.11",
  "pre-commit>=3.8",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.12",
  "scipy-stubs>=1.15",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bubblegen"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "ARG", # unused arguments
  "B",   # bugbear
  "C4",  # comprehensions
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # import order
  "N",   # naming
  "NPY", # numpy legacy API
  "PTH", # use pathlib
  "RET", # return simplification
  "RUF",
  "SIM", # simplify
  "UP",  # pyupgrade
  "W",
]
ignore = [
  "RUF001", # non-Latin alphabets are the point of this tool
]

[tool.ruff.lint.isort]
known-first-party = ["bubblegen"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001"] # fixtures are injected by name

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_unreachable = true
# these ship no annotations for the functions we call; their arguments stay unchecked
untyped_calls_exclude = ["trimesh", "skimage", "scipy", "matplotlib", "fontTools"]

[[tool.mypy.overrides]]
module = ["fontTools.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/bubblegen"]
branch = true

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
